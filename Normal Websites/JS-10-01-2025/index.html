<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Api Function</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="formContainer">
        <label for="name">Enter name: </label>
        <input type="text" name="name" id="name">

        <label for="email">Enter email: </label>
        <input type="text" name="email" id="email">

        <label for="salary">Enter salary: </label>
        <input type="number" name="salary" id="salary">

        <label for="search">Search: </label>
        <input type="text" name="search" id="search" oninput="searchWithName()">

        <button onclick="addEmployee()">Add Employee</button>
        
    </div>

    <div class="SearchByID">
        <label for="searchById">Enter Employee ID: </label>
        <input type="text" name="searchById" id="searchById">

        <button onclick="showEmployeeById()">Search Employee By Id</button>
    </div>
    
    <div class="container">
    </div>
    <script src="index.js"></script>
</body>
</html>
