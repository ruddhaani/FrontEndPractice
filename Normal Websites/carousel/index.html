<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward"
    />

    <!-- Swiper for carousel -->
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />


    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container swiper">
      <div class="card-wrapper">
        <ul class="card-list swiper-wrapper">
          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img
                src="./images/carl-raw-m3hn2Kn5Bns-unsplash.jpg"
                alt="Card Image"
                class="card-image"
              />
              <p class="badge-Sen">Sentinels</p>
              <h2 class="card-title">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Recusandae, nemo?
              </h2>
              <button class="card-button material-symbols-rounded"> arrow_forward </button>
            </a>
          </li>

          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img
                src="./images/florian-olivo-Mf23RF8xArY-unsplash.jpg"
                alt="Card Image"
                class="card-image"
              />
              <p class="badge-Loud">Loud</p>
              <h2 class="card-title">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Recusandae, nemo?
              </h2>
              <button class="card-button material-symbols-rounded"> arrow_forward </button>
            </a>
          </li>

          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img
                src="./images/glenn-carstens-peters-0woyPEJQ7jc-unsplash.jpg"
                alt="Card Image"
                class="card-image"
              />
              <p class="badge-G2">G-2 Esports</p>
              <h2 class="card-title">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Recusandae, nemo?
              </h2>
              <button class="card-button material-symbols-rounded"> arrow_forward </button>
            </a>
          </li>
        </ul>

        <div class="swiper-pagination"></div>
        <div class="swiper-slide-button swiper-button-prev"></div>
        <div class="swiper-slide-button swiper-button-next"></div>
      </div>
    </div>

    <!-- Linking Swiper JS  -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Linking custom JS  -->
     <script src="app.js"></script>
  </body>
</html>
