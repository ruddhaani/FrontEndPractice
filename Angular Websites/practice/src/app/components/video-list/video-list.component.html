<app-video-player *ngIf="playVideoFlag" [videoDetails]="playableVideo"></app-video-player>

<div [ngClass]="{'cardList' : true}">
<app-video *ngFor="let video of videoList" [ngClass]="{'active-card' : video.title == playableVideo.title}" [videoDetails]="video" (click)="handleVideoClick(video)">
    
</app-video>
</div>
