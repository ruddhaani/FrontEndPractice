        <div class="self-center mt-5 mb-5">
          <h2 class="font-exo text-2xl text-center font-semibold self-center">
            Welcome Back!
          </h2>
          <p class="text-center text-greySecondaryText mb-5">Welcome back! Please  enter your details.</p>
        </div>
        <hr class="mb-5 lg:hidden">
        <div class="flex flex-col gap-2 p-3">
          <label for="nameSignup" class="font-exo text-lg">Name<span class="text-red-400">*</span></label>
          <input type="text" id="nameSignup" name="nameSignup" class="border rounded-lg h-18 p-2">
        </div>

        <div class="flex flex-col gap-2 p-3">
          <label for="emailSignup" class="font-exo text-lg">Email<span class="text-red-400">*</span></label>
          <input type="text" id="emailSignup" name="emailSignup" class="border rounded-lg h-18 p-2">
        </div>

        <div class="flex flex-col gap-2 p-3">
            <label for="phoneSignup" class="font-exo text-lg">Phone<span class="text-red-400">*</span></label>
            <input type="text" id="phoneSignup" name="phoneSignup" class="border rounded-lg h-18 p-2">
          </div>

          <div class="flex flex-col gap-2 p-3">
            <label for="passwordSignup" class="font-exo text-lg">Password<span class="text-red-400">*</span></label>
            <input type="password" id="passwordSignup" name="passwordSignup" class="border rounded-lg h-18 p-2">
          </div>

        <div class="flex justify-center mt-5 mb-5">
          <button class="bg-LightGreen w-11/12 p-3 rounded-xl text-lg font-exo font-semibold transition ease-in-out delay-100 hover:translate-y-[-0.8rem] duration-500" id="loginSubmitButton" onclick="SignUp()">Sign Up</button>
        </div>

        <p class="self-center text-center font-semibold text-xl mb-2">Already, have an account? <span class="text-logo underline underline-offset-8 cursor-pointer transition ease-in-out hover:text-clifford duration-300"><a href="login.html">Login</a></span></p>
